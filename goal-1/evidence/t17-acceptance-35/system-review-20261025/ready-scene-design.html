<title>长日重启 · 样课完成整幕设计稿</title>
<style>
:root{color-scheme:dark;--paper:#eee4cc;--gold:#c7b17d;--ink:#13252a;--red:#dbb09e}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0a181e;color:var(--paper);font-family:system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #f1cf85;outline-offset:5px}button:disabled{cursor:default;color:#aa9d8a}.review-bar{height:56px;display:flex;align-items:center;gap:18px;padding:0 24px;background:#101d23;border-bottom:1px solid #89744c;color:#d7cdb7;font-size:13px}.review-bar b{font-weight:500;letter-spacing:2px}.review-bar span{margin-left:auto}.review-bar select{background:#192c33;color:var(--paper);padding:7px;border:1px solid #7b755f}.scene{height:calc(100vh - 56px);position:relative;isolation:isolate;background:#10242b url('../../../../assets/ui-redesign/cinematic/room-ordinary-v1.jpg') center/cover}.scene:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#081c23a8,transparent 68%),linear-gradient(0deg,#071c25fa,transparent 52%)}.date{position:absolute;left:5%;top:5%;font:23px Georgia,serif;letter-spacing:3px}.wish{position:absolute;left:5%;top:12%;font-size:13px;letter-spacing:2px;color:#c2c0ac}.hud{position:absolute;right:5%;top:5%;font-size:13px;text-align:right;line-height:1.9;padding:8px 16px;background:#112a30d9;border-right:1px solid var(--gold)}.hud strong{font:22px Georgia,serif}.question{position:absolute;left:5%;top:23%;max-width:560px}.question h1{font:31px/1.55 Georgia,'Songti SC',serif;letter-spacing:2px;margin:0 0 14px}.question p{max-width:460px;font-size:14px;line-height:1.8;color:#d0c9b7;margin:0}.object{position:absolute;left:35%;top:40%;width:34%;height:30%;border:0;background:transparent;padding:0;transform:rotate(-3deg)}.object:before{content:'';position:absolute;left:6%;bottom:2%;width:90%;height:30%;background:linear-gradient(12deg,#2b2019,#5c4931);border-bottom:8px solid #251c15;transform:skewX(-18deg);box-shadow:0 25px 25px #0009}.object img{position:absolute;left:0;bottom:8%;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 9px #0008)}.object .tag{position:absolute;bottom:0;right:10%;background:#e4d6ad;color:#3f3827;padding:7px 16px;font-size:13px;border-left:3px solid #a68c57}.object:hover img,.object:focus-visible img{filter:drop-shadow(0 12px 9px #0008) brightness(1.08)}.choices{position:absolute;left:5%;bottom:17%;display:grid;gap:12px;max-width:550px}.thought{border:0;border-bottom:1px solid #9c8d68;padding:10px 0;background:transparent;color:var(--paper);text-align:left;font-family:Georgia,'Songti SC',serif;font-size:19px;letter-spacing:1px}.thought span{font:12px system-ui;color:#b4a889;margin-right:17px}.thought:hover{color:#f6d698;border-color:#e9c776}.record{position:absolute;left:5%;bottom:7%;display:flex;gap:25px}.record button,.clock button{border:0;background:transparent;color:#d1c9b2;font-size:13px;padding:5px 0;border-bottom:1px solid #897c5a}.clock{position:absolute;right:5%;bottom:7%;text-align:right}.clock small{display:block;font-size:11px;color:#b9ae94;margin-top:7px}.inspector{position:absolute;right:5%;top:25%;width:34%;max-height:62%;padding:22px 26px;background:#ecdfc6;color:#283335;box-shadow:0 20px 60px #0008;border-top:3px solid #b69a5d}.inspector[hidden]{display:none}.inspector .kind{font-size:11px;letter-spacing:2px;color:#726044}.inspector h2{font:23px/1.5 Georgia,'Songti SC',serif;margin:10px 0}.inspector p{font-size:13px;line-height:1.75;margin:9px 0}.inspector .warning{border-left:3px solid #9a5842;padding-left:12px;color:#773e2c}.inspector button{border:1px solid #94856a;background:transparent;color:#33403d;padding:7px 10px;font-size:13px;margin-top:10px}.inspector button:disabled{background:#d2c6af;color:#635d52}.template{position:absolute;right:5%;bottom:17%;font-size:12px;color:var(--red);max-width:340px}.footer-label{position:absolute;bottom:2%;left:5%;font-size:10px;letter-spacing:2px;color:#b6b29e}
</style>
<header class="review-bar"><b>长日重启 · 整幕设计</b><label>切换设计态 <select id="state"><option value="ready">原86 · 样课已完成</option><option value="source">查看来源</option><option value="shortfall">选择付费 · 资金不足</option><option value="draft">空草稿 / 尚未显选</option><option value="confirm">原确认 · 布局模板</option><option value="saved">保存以后 · 布局模板</option><option value="candidate">候选未保存 · 模板</option><option value="today">回到今天 · 模板</option></select></label><span>设计稿 · 未接存档 · 不执行命令</span></header>
<main class="scene">
 <div class="date">2023 · 01 · 15</div><div class="wish">我想保持生活自主</div>
 <div class="hud">课程企业可花 <strong>¥5,519.36</strong><br>本人行动 2 / 4 · 预留 0　　原档已保存 · 86</div>
 <section class="question"><h1 id="headline">样课做好了。<br>下一段时间，想留给谁？</h1><p id="description">教案已经留下。今天，还没有学员。</p></section>
 <button type="button" class="object" id="object" aria-label="样课已完成；先了解谁可能需要这堂课（仅切换设计态）"><img src="../../../../assets/ui-redesign/cinematic/props/course-preparation-kit-v1.png" alt="桌前木托架上的完成教案"><span class="tag">样课已完成</span></button>
 <div class="choices"><button type="button" class="thought" id="primary"><span>01</span>先了解，谁可能需要这堂课 ↗</button><button type="button" class="thought" id="secondary"><span>02</span>把样课收好，回到今天 ↗</button></div>
 <div class="record"><button id="records" type="button">翻看这份教案与原账 ↗</button><button id="calendar" type="button">随身册 · 日历 ↗</button></div>
 <div class="clock"><button id="clock" type="button">◷ 让日子继续到 2023-01-20</button><small>正式游戏仍先核费用、期限与原确认</small></div>
 <aside class="inspector" id="inspector" hidden aria-live="polite"><div class="kind" id="kind"></div><h2 id="title"></h2><p id="copy"></p><p id="notice" class="warning"></p><button type="button" id="stateAction"></button><button type="button" id="back">合上，回到原86设计态</button></aside>
 <p class="template" id="template" hidden>此态仅演示布局。资金/AP仍是原86基线，未产生新意向、报名或收入。</p>
 <div class="footer-label">原有房间与教案素材 · 不新增人物/学员/票据 · 实际旧责任仍由原档判定并常显</div>
</main>
<script>
const states={
 source:{kind:'查看，不是承诺',title:'先看来源，再写这次拟报价。',copy:'付费推广需6000元、1点、7日；当前资金不足。视频来源只有原公开记录实际匹配时才能显选，本稿没有预设。',notice:'未选来源与拟报价，不构造命令；班额、教学、支持和报名在后续独立决定。',action:'看看付费方案的当前不足',next:'shortfall'},
 shortfall:{kind:'原86 · 真实不足',title:'这次推广，还差 ¥480.64。',copy:'付费成本 ¥6,000；当前课程企业可花 ¥5,519.36。行动2/4并不能补足现金；资源、日期与资格仍须原规则核对。',notice:'不能靠未来学费或受保护款填缺口。可另行显选自有资本并独立确认，亦可暂缓。',action:'资金不足 · 本稿不执行推广',disabled:true},
 draft:{kind:'尚未显选',title:'这份决定，还留着空白。',copy:'原来源、拟报价与所需资源/日期均由玩家显选。当前不默认最近视频、不补报价、不预设意向人数。',notice:'取消/翻页保同身份草稿；来源失效先解释，再由玩家重选。',action:'未形成合法payload · 不可提交',disabled:true},
 confirm:{kind:'未来布局模板 · 非原确认回执',title:'先看清，这次准备答应什么。',copy:'正式游戏这里放原preview捕获的来源、拟报价、资源、确定费用/AP及日期；不得在确认后换值。',notice:'本设计稿没有显选合法方案，因此不展示假的已选金额或可执行确认。',action:'模板不执行任何命令',disabled:true,template:true},
 saved:{kind:'未来布局模板 · 没有新结果',title:'保存后，物件才留下新约定。',copy:'实际接线后按原投影区分推广已安排、推广运行和实际形成意向；意向仍不是报名或收入。',notice:'本稿不制造人数、报价、收入或新日期；这里只审阅读次序和新约定的落点。',action:'回看原86设计基线',next:'ready',template:true},
 candidate:{kind:'未来保护态模板',title:'还没有保存下来。',copy:'旧教案、旧现金与旧行动保持。正式游戏显示原候选及原retry/恢复入口，不先摆出新约定。',notice:'此稿未触发真实存储失败。运行时只有原retry实际成功才发布结果。',action:'此处只预留原恢复入口',disabled:true,template:true},
 today:{kind:'UI去向模板 · 不新增承诺',title:'教案收好，今天仍由你安排。',copy:'正式游戏读取当前真实工作、生活和旧责任，再由你显选；回今天不关闭企业、不续约、不收钱。',notice:'这里没有伪造新的生活安排，也不把回今天当成一次业务保存。',action:'回到这份已完成教案',next:'ready',template:true},
 record:{kind:'同对象依据入口 · 位置稿',title:'翻阅这份教案的原依据。',copy:'正式游戏携同run/企业/课程身份进入原分页；资金、权利、准备、旧责任和原日期完整可达。',notice:'本稿没有复制或接入原账；此按钮只演示阅读入口的位置。',action:'回到当前设计态',next:'ready'},
 clock:{kind:'原Clock入口 · 位置稿',title:'过日子，也要先看清代价。',copy:'正式游戏仍沿原费用、期限、交付和季度屏障，以及原预览/确认推进。',notice:'本稿不会推进日期；2023-01-20只沿用原86当前公开Clock。',action:'保持原86日期',next:'ready'}
};
const select=document.getElementById('state'),inspector=document.getElementById('inspector'),action=document.getElementById('stateAction');
function show(key){const s=states[key];inspector.hidden=!s;document.getElementById('template').hidden=!s?.template;if([...select.options].some(x=>x.value===key))select.value=key;if(!s)return;document.getElementById('kind').textContent=s.kind;document.getElementById('title').textContent=s.title;document.getElementById('copy').textContent=s.copy;document.getElementById('notice').textContent=s.notice;action.textContent=s.action;action.disabled=Boolean(s.disabled);action.onclick=()=>show(s.next??'ready');}
select.addEventListener('change',()=>show(select.value));document.getElementById('primary').onclick=()=>show('source');document.getElementById('object').onclick=()=>show('source');document.getElementById('secondary').onclick=()=>show('today');document.getElementById('records').onclick=()=>show('record');document.getElementById('calendar').onclick=()=>show('record');document.getElementById('clock').onclick=()=>show('clock');document.getElementById('back').onclick=()=>show('ready');
</script>
</html>
